name: Bug report
description: Something in AXbit isn't working the way it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: |
        What were you doing, what did you expect, and what happened instead?
        Rough steps are fine — we can fill in gaps together in the thread.
      placeholder: |
        Describe in a few lines. 

        Steps: ...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: |
        Logs, error output, commit hash, OS, which kernel groups were loaded,
        screenshots, comparison data — whatever you've got. Drag files in if useful.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Main area
      options:
        - Integrator / force models
        - Simulation / uncertainty analysis
        - SPICE / SBDB / kernels / reference frames
        - Rendering / graphics
        - UI / interaction
        - Build / platform support
        - Performance
        - Not sure
    validations:
      required: false
