name: Idea or feature request
description: Suggest a capability, method, analysis tool, or improvement
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell what you're trying to do — a design or approach is welcome
        too.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, question, or limitation you're running into.
      placeholder: |
        Describe in a few lines your feature request
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Got an idea for how to solve it?
      description: |
        Equations, sketches —
        anything. Fine to leave blank and discuss.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Main area (guess is fine)
      options:
        - Integrator / force models
        - Simulation / uncertainty / Monte Carlo
        - Validation / accuracy
        - SPICE / SBDB / kernels / reference frames
        - Rendering / graphics
        - UI / workflow
        - Performance
        - Documentation / examples
        - Not sure
    validations:
      required: false
