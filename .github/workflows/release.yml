name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: macOS arm64 package
    runs-on: macos-15
    timeout-minutes: 60

    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$tag_version" = "$cargo_version" || {
            echo "::error::Tag version $tag_version does not match Cargo.toml version $cargo_version"
            exit 1
          }
          echo "RELEASE_VERSION=$cargo_version" >> "$GITHUB_ENV"

      - name: Install CSPICE
        uses: ./.github/actions/setup-cspice-macos-arm64

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Import Apple Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare Apple API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          printf '\n[package.metadata.packager.macos]\nsigning-identity = "%s"\n' \
            "$APPLE_SIGNING_IDENTITY" >> Cargo.toml

      - name: Build and archive application
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail

          cargo packager --release
          codesign --verify --deep --strict --verbose=2 app/AXbit.app
          xcrun stapler validate app/AXbit.app
          spctl --assess --type execute --verbose=2 app/AXbit.app

          archive="app/AXbit-v${RELEASE_VERSION}-aarch64-apple-darwin.zip"
          ditto -c -k --sequesterRsrc --keepParent app/AXbit.app "$archive"
          rm -rf app/AXbit.app

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: AXbit ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/AXbit-v${{ env.RELEASE_VERSION }}-aarch64-apple-darwin.zip
