[package]
name = "AXbit"
identifier = "com.axneo27.AXbit"
version = "0.1.0"
edition = "2024"

build = "build.rs"

[dependencies]
anyhow = "1.0.100"
bytemuck = "1.24.0"
cgmath = "0.18.0"
chrono = "0.4.43"
dotenv = "0.15.0"
egui = "0.33.3"
egui-wgpu = "0.33.3"
egui-winit = "0.33.3"
egui_extras = { version = "0.33.3", features = ["chrono"] }
env_logger = "0.11.8"
futures-intrusive = "0.5.0"
image = "0.25.8"
libc = "0.2.177"
log = "0.4.28"
parking_lot = "0.12.5"
pollster = "0.4.0"
tobj = "4.0.3"
wgpu = "27.0.1"
winit = "0.30.12"
ode_solvers = "0.6.2"
nalgebra = "0.34.2"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
thiserror = "2.0"
url = "2.5"

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
cc = "1.0"

[package.metadata.packager]
before-packaging-command = "cargo build --release"